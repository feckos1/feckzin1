name: Android Cloud Compiler

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL do arquivo ZIP do projeto'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Baixar e Preparar Projeto
      run: |
        echo "Baixando código de: ${{ github.event.inputs.project_url }}"
        curl -L -A "Mozilla/5.0" "${{ github.event.inputs.project_url }}" -o project.zip
        mkdir -p project_src
        unzip -o project.zip -d project_src || true
        
        cd project_src
        echo "=== CONTEÚDO EXTRAÍDO ==="
        find . -maxdepth 3
        
        # 1. Procura onde está o settings.gradle ou build.gradle
        TARGET_DIR=$(find . -name "settings.gradle*" -printf "%h\n" | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -name "build.gradle*" -printf "%h\n" | head -n 1)
        fi
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -name "AndroidManifest.xml" -printf "%h\n" | head -n 1)
        fi
        
        if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
          echo "Projeto localizado em $TARGET_DIR, trazendo para a raiz..."
          cp -r $TARGET_DIR/* . || true
        fi
        
        # 2. Se não existir settings.gradle, cria um automaticamente
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "Criando settings.gradle padrão..."
          cat << 'EOF' > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "AndroidApp"
if (new File(rootDir, 'app').exists()) {
    include ':app'
}
EOF
        fi
        
        # 3. Se não existir root build.gradle, cria um padrão
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo "Criando build.gradle raiz padrão..."
          cat << 'EOF' > build.gradle
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF
        fi
        
        # 4. Injeta sdk.dir
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        echo "=== ESTRUTURA FINAL ==="
        ls -la
      
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Compilar APK com Gradle
      run: |
        cd project_src
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          echo "Tentando compilação com Gradle do sistema..."
          gradle assembleDebug --no-daemon --stacktrace || (gradle wrapper && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace)
        fi
      
    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: |
          project_src/**/build/outputs/apk/debug/*.apk
          project_src/**/*.apk