name: Android Cloud Compiler

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL do arquivo ZIP do projeto'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4
      
    - name: Baixar o Projeto do Celular
      run: |
        echo "Baixando de: ${{ github.event.inputs.project_url }}"
        curl -L -A "Mozilla/5.0" "${{ github.event.inputs.project_url }}" -o project.zip
        file project.zip
        ls -lh project.zip
      
    - name: Extrair Arquivos
      run: |
        mkdir -p project_src
        unzip -o project.zip -d project_src || (unzip -o project.zip && mv * project_src/ 2>/dev/null || true)
        echo "Arquivos extraídos:"
        ls -la project_src
      
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Dar permissão ao Gradle
      run: |
        cd project_src
        if [ ! -f "gradlew" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "gradlew" -printf "%h\n" | head -n 1)
          if [ -n "$SUBDIR" ]; then
            cp -rn $SUBDIR/* .
          fi
        fi
        chmod +x gradlew || true
      
    - name: Compilar o APK (Debug)
      run: |
        cd project_src
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi
      
    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: project_src/**/build/outputs/apk/debug/*.apk
